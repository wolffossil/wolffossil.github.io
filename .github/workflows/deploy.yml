name: Deploy Hugo site to Pages

on:
  # 推送到默认分支时自动构建部署
  push:
    branches:
      - main
      - master
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署到 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一个并发部署，取消进行中的旧任务
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hugo 版本：锁定为已验证可正常构建当前主题的版本。
      # 注意：主题 fork 误把一张 favicon.png 放进了 layouts/partials/ 下，
      # Hugo >= 0.158 会把它当模板解析而报错，故暂锁 0.121.2。
      # 后续清掉那张图或升级主题后，可再往上升级本版本号。
      HUGO_VERSION: 0.121.2
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 拉取主题子模块
          fetch-depth: 0          # 供 .GitInfo / .Lastmod 使用

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
